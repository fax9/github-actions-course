name: 06 Secrets and Token
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Use variable and secret
        run: |
          echo "Variable: ${{ vars.MY_VAR }}"
          echo "Secret: ${{ secrets.MY_SECRET }}"
      - name: Call REST API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }} --jq '.full_name, .visibility'
