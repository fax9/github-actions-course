name: 10 Service Container
on: [workflow_dispatch]
jobs:
  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Query the database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE TABLE students(id int, name text);"
          psql -h localhost -U postgres -c "INSERT INTO students VALUES (1,'fax9');"
          psql -h localhost -U postgres -c "SELECT * FROM students;"
